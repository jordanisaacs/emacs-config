[package]
name = "fwatcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fwatcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
globset = "0.4"
inotify = { version = "0.11", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "signal"] }
tokio-stream = "0.1"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true
